theme: jekyll-theme-chirpy

lang: en
timezone: Asia/Shanghai

title: Haipeng Gan
tagline: AI for evidence-grounded molecular discovery
description: >-
  Portfolio of Haipeng Gan, MSc student at Nanjing University working on
  AI-assisted molecular discovery, peptide catalysts, peptide inhibitors, and
  reaction-language models.

url: "https://taishen8.github.io"
baseurl: ""

github:
  username: Taishen8

social:
  name: Haipeng Gan
  email: haipeng.gan@smail.nju.edu.cn
  links:
    - https://taishen8.github.io/
    - https://github.com/Taishen8

webmaster_verifications:
  google:
  bing:
  alexa:
  yandex:
  baidu:
  facebook:

analytics:
  google:
    id:
  goatcounter:
    id:
  umami:
    id:
    domain:
  matomo:
    id:
    domain:
  cloudflare:
    id:
  fathom:
    id:

pageviews:
  provider:

theme_mode:
cdn:
avatar: /assets/images/bio-photo.jpg
social_preview_image:

toc: true

comments:
  provider:

assets:
  self_host:
    enabled:
    env:

pwa:
  enabled: false

kramdown:
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

collections:
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: false
      toc: true
      permalink: /posts/:title/
  - scope:
      path: _drafts
    values:
      comments: false
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/

sass:
  style: compressed

compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false
  ignore:
    envs: [development]

exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - tools
  - README.md
  - LICENSE
  - purgecss.js
  - "*.config.js"
  - "package*.json"
  - LAYOUTS-GUIDE.md
  - QUICK-START.md
  - examples
  - bin
  - _posts
  - "_config.yml~"
  - "._config.yml.un~"

jekyll-archives:
  enabled: []
